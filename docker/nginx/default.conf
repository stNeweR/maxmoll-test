# Конфигурация Nginx для Laravel и Vue (SPA)
server {
    listen 80;
    server_name localhost;
    root /var/www/public;
    index index.php index.html;

    # Размер загружаемых данных
    client_max_body_size 64M;

    # Логирование запросов/ошибок
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Стандартные статические файлы отдаём напрямую
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Все .php файлы обрабатываются PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
    }

    # Не даём отдавать .env, делает приложение безопаснее
    location ~ /\.(?!well-known).* {
        deny all;
    }
}